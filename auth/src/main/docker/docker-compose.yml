
services:
  app:
    image: 'docker-spring-boot-postgres:latest'
    build:
      context: .
    container_name: app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - PORT=${PORT}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${INSTANCE}
      - SPRING_DATASOURCE_USERNAME=${INSTANCE}
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
          
  db:
    image: 'postgres:13.1-alpine'
    container_name: db
    environment:
      - POSTGRES_USER=${INSTANCE}
      - POSTGRES_PASSWORD=password