##
## MULTIPART (MultipartProperties)
##
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB

##
## Logging
##
logging.level.com.example.demo=DEBUG

##
## rabbitmq
##
# RabbitMQ server configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672

spring.rabbitmq.template.retry.enabled=false
spring.rabbitmq.publisher-confirm-type=correlated
logging.level.org.springframework.amqp=DEBUG

# Custom RabbitMQ application properties
app.rabbitmq.userExchange=user.exchange
app.rabbitmq.userCreatedQueue=user.created.queue
app.rabbitmq.userCreatedRoutingKey=user.created

app.rabbitmq.userUpdatedQueue=user.updated.queue
app.rabbitmq.userUpdatedRoutingKey=user.updated