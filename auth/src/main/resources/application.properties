##
## Profiles
##
spring.profiles.active=bootstrap

##
## OpenAPI
##
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

##
## JWT
##
jwt.private.key=classpath:rsa.private.key
jwt.public.key=classpath:rsa.public.key

##
## datasource 
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=pedro
spring.datasource.password=password
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.database-platform=org.hibernate.dialect.PostgreSQLDialect
##spring.datasource.url=jdbc:h2:file:./auth/data/${INSTANCE}
## jdbc:h2:tcp://localhost/~/test
##spring.datasource.driverClassName=org.h2.Driver
##spring.datasource.username=sa
##spring.datasource.password=
##spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
##spring.jpa.hibernate.dialect=org.hibernate.dialect.H2Dialect

## show SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
#logging.level.org.springframework.transaction=DEBUG

## database schema generation
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create

## H2 console for development purposes.
## e.g., http://localhost:8080/h2-console
##
## for security reasons this setting should be false
##spring.h2.console.enabled=true
##spring.h2.console.path=/h2-console
##
## MULTIPART (MultipartProperties)
##
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB

##
## Logging
##
logging.level.com.example.demo=DEBUG