services:
  app:
    build: ../../auth
    container_name: ${INSTANCE}
    ports: 
      - "${PORT}:8080"
    networks:
      - default_bridge
      - internal_bridge
    environment:
      - port=8080
      - instance=${INSTANCE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${INSTANCE}
      - SPRING_DATASOURCE_USERNAME=${INSTANCE}
      - SPRING_DATASOURCE_PASSWORD=${INSTANCE}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      
    depends_on:
      - database

  database:
    image: 'postgres:13.1-alpine'
    container_name: database_${INSTANCE}
    networks:
      - internal_bridge
    environment:
      - POSTGRES_USER=${INSTANCE}
      - POSTGRES_PASSWORD=${INSTANCE}

networks:
  default_bridge:
    external: true
    name: eCondo_network
  internal_bridge:
    external: false
    name: internal_bridge_${INSTANCE}