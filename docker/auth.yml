services:
  app:
    build: ../auth
    container_name: auth
    ports: 
      - "8080:8080"
    networks:
      - default_bridge
      - internal_bridge
    environment:
      - port=8080
      - instance=AUTH
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/auth
      - SPRING_DATASOURCE_USERNAME=auth
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      
    depends_on:
      - database

  database:
    image: 'postgres:13.1-alpine'
    container_name: database
    networks:
      - internal_bridge
    environment:
      - POSTGRES_USER=auth
      - POSTGRES_PASSWORD=admin

networks:
  default_bridge:
    external: true
    name: eCondo_network
  internal_bridge:
    external: false
    name: internal_bridge_auth